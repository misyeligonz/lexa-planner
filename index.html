<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1f2937">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Lexa Book Studio</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --brand: #1f4f8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eef2f8 0%, #fafbfc 40%, #fff 100%);
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
      grid-template-columns: minmax(300px, 420px) 1fr;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 8px 28px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 .2rem; font-size: 1.35rem; }
    .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: .8rem; }
    label { display: block; font-size: .85rem; margin: .7rem 0 .2rem; color: #374151; }
    textarea, select, input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .6rem .7rem;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 240px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .btns { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .9rem; }
    button {
      border: none;
      border-radius: 10px;
      padding: .6rem .8rem;
      cursor: pointer;
      font-weight: 600;
    }
    .primary { background: var(--brand); color: #fff; }
    .secondary { background: #eef2ff; color: #1e3a8a; }
    .ghost { background: #f8fafc; color: #1f2937; border: 1px solid var(--border); }

    .preview-wrap {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      padding: .5rem;
      max-height: calc(100vh - 3rem);
      overflow: auto;
      background: #e5e7eb;
      border-radius: 12px;
    }
    .page {
      background: #fff;
      color: #111;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .page-content { width: 100%; }
    .page-number {
      position: absolute;
      bottom: .35in;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10pt;
      color: #555;
    }
    .chapter {
      font-size: 18pt;
      text-transform: uppercase;
      letter-spacing: .08em;
      text-align: center;
      margin: 1.2em 0 1.8em;
      page-break-after: avoid;
    }
    .status { font-size: .85rem; color: var(--muted); margin-top: .5rem; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .preview-wrap { max-height: unset; }
    }

    @media print {
      body { background: #fff; }
      .panel:first-child { display: none !important; }
      .app { display: block; max-width: none; padding: 0; }
      .panel { border: none; box-shadow: none; padding: 0; }
      .preview-wrap { background: transparent; gap: 0; padding: 0; overflow: visible; }
      .page { box-shadow: none; margin: 0; page-break-after: always; }
      .page:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Lexa Book Studio</h1>
      <div class="subtitle">Paste manuscript text and preview a clean, print-ready book layout.</div>

      <label for="rawText">Manuscript</label>
      <textarea id="rawText" placeholder="Paste your manuscript here. Use blank lines between paragraphs.\nStart chapters with 'Chapter 1', 'CHAPTER ONE', etc."></textarea>

      <div class="grid-2">
        <div>
          <label for="trimSize">Trim size</label>
          <select id="trimSize">
            <option value='{"w":6,"h":9}'>6" × 9" (Trade)</option>
            <option value='{"w":5.5,"h":8.5}'>5.5" × 8.5"</option>
            <option value='{"w":8.5,"h":11}'>8.5" × 11"</option>
          </select>
        </div>
        <div>
          <label for="fontFamily">Body font</label>
          <select id="fontFamily">
            <option value="Georgia, 'Times New Roman', serif">Serif (Book)</option>
            <option value="'Palatino Linotype', Palatino, serif">Palatino</option>
            <option value="Arial, Helvetica, sans-serif">Sans Serif</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="fontSize">Font size (pt)</label>
          <input id="fontSize" type="number" min="9" max="14" step="0.5" value="11" />
        </div>
        <div>
          <label for="lineHeight">Line height</label>
          <input id="lineHeight" type="number" min="1.1" max="2" step="0.05" value="1.4" />
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="indent">First-line indent (in)</label>
          <input id="indent" type="number" min="0" max="0.6" step="0.05" value="0.25" />
        </div>
        <div>
          <label for="margins">Margins (in)</label>
          <input id="margins" type="number" min="0.5" max="1.5" step="0.05" value="0.75" />
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="buildBtn">Build Book</button>
        <button class="secondary" id="sampleBtn">Load Sample</button>
        <button class="ghost" id="printBtn">Print / Save PDF</button>
      </div>
      <div class="status" id="status">No pages rendered yet.</div>
    </section>

    <section class="panel">
      <div id="preview" class="preview-wrap" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const byId = (id) => document.getElementById(id);

    const rawText = byId('rawText');
    const trimSize = byId('trimSize');
    const fontFamily = byId('fontFamily');
    const fontSize = byId('fontSize');
    const lineHeight = byId('lineHeight');
    const indent = byId('indent');
    const margins = byId('margins');
    const preview = byId('preview');
    const status = byId('status');

    function isChapter(line) {
      return /^(chapter\s+\w+|ch\.\s*\w+|part\s+\w+)/i.test(line.trim());
    }

    function manuscriptBlocks(text) {
      return text
        .split(/\n{2,}/)
        .map((p) => p.replace(/\n+/g, ' ').trim())
        .filter(Boolean)
        .map((t) => ({ type: isChapter(t) ? 'chapter' : 'p', text: t }));
    }

    function applyPageStyle(page, options) {
      page.style.width = `${options.w}in`;
      page.style.height = `${options.h}in`;
      page.style.padding = `${options.margin}in`;
      page.style.fontFamily = options.font;
      page.style.fontSize = `${options.fontSize}pt`;
      page.style.lineHeight = String(options.lineHeight);
      page.style.textAlign = 'justify';
      page.style.hyphens = 'auto';
    }

    function makeParagraph(text, opts, firstInSection) {
      const p = document.createElement('p');
      p.textContent = text;
      p.style.margin = '0 0 .6em';
      p.style.textIndent = firstInSection ? '0' : `${opts.indent}in`;
      p.style.orphans = '2';
      p.style.widows = '2';
      return p;
    }

    function buildBook() {
      const blocks = manuscriptBlocks(rawText.value);
      const size = JSON.parse(trimSize.value);
      const opts = {
        w: size.w,
        h: size.h,
        margin: Number(margins.value) || 0.75,
        font: fontFamily.value,
        fontSize: Number(fontSize.value) || 11,
        lineHeight: Number(lineHeight.value) || 1.4,
        indent: Number(indent.value) || 0.25
      };

      preview.innerHTML = '';
      if (!blocks.length) {
        status.textContent = 'Paste manuscript text, then click Build Book.';
        return;
      }

      const measuringPage = document.createElement('article');
      measuringPage.className = 'page';
      applyPageStyle(measuringPage, opts);

      const pageContent = document.createElement('div');
      pageContent.className = 'page-content';
      measuringPage.appendChild(pageContent);

      const maxHeightPx = (opts.h - (opts.margin * 2) - 0.45) * 96;

      const pages = [];
      let currentPage = measuringPage;
      let currentContent = pageContent;
      let isFirstAfterChapter = true;

      const flushPage = () => {
        const page = currentPage.cloneNode(true);
        pages.push(page);
        currentPage = document.createElement('article');
        currentPage.className = 'page';
        applyPageStyle(currentPage, opts);
        currentContent = document.createElement('div');
        currentContent.className = 'page-content';
        currentPage.appendChild(currentContent);
        isFirstAfterChapter = true;
      };

      for (const block of blocks) {
        if (block.type === 'chapter') {
          const h2 = document.createElement('h2');
          h2.className = 'chapter';
          h2.textContent = block.text;
          currentContent.appendChild(h2);
          if (currentContent.scrollHeight > maxHeightPx) {
            currentContent.removeChild(h2);
            flushPage();
            currentContent.appendChild(h2);
          }
          isFirstAfterChapter = true;
          continue;
        }

        const p = makeParagraph(block.text, opts, isFirstAfterChapter);
        currentContent.appendChild(p);
        if (currentContent.scrollHeight > maxHeightPx) {
          currentContent.removeChild(p);
          flushPage();
          const p2 = makeParagraph(block.text, opts, true);
          currentContent.appendChild(p2);
        }
        isFirstAfterChapter = false;
      }

      if (currentContent.childNodes.length) pages.push(currentPage.cloneNode(true));

      pages.forEach((p, i) => {
        const n = document.createElement('div');
        n.className = 'page-number';
        n.textContent = `${i + 1}`;
        p.appendChild(n);
        preview.appendChild(p);
      });

      status.textContent = `Rendered ${pages.length} page(s) • ${blocks.length} block(s).`;
    }

    byId('buildBtn').addEventListener('click', buildBook);
    byId('sampleBtn').addEventListener('click', () => {
      rawText.value = `CHAPTER 1\n\nA cold rain drew silver lines down the station windows as Mara unfolded the letter for the third time. She already knew every crease in the page, every hesitant stroke in her father's handwriting, and still she searched for a different ending.\n\nThe platform loudspeaker crackled. Somewhere beneath the static, a train number dissolved into echoes and footsteps.\n\nCHAPTER 2\n\nBy noon the city had warmed, but the library kept its winter chill. Dust drifted through shafts of light while Mara traced the map laid open before her.`;
      buildBook();
    });
    byId('printBtn').addEventListener('click', () => window.print());

    buildBook();
  </script>
</body>
</html>
